name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Dataset
        run: node validate.js

      - name: Build / Prepare Dist
        run: |
          mkdir dist
          cp index.html dist/
          cp styles.css dist/
          cp app.js dist/
          cp systems.json dist/
          cp tools.json dist/
          cp orion-skills.json dist/
          cp orion-skills-guide.json dist/
          cp -r assets/ dist/
          cp .nojekyll dist/ || true
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
